[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tea"
version = "1.0.0"
description = "Topic-Enabled Autoencoders: topics from the weight matrix of a closed-form linear autoencoder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    "pandas==3.0.5",
    "threadpoolctl==3.6.0",
    "joblib==1.5.3",
    "openpyxl==3.1.5",
    "matplotlib==3.10.9",
]

[project.optional-dependencies]
neural = ["torch==2.13.0"]
figure = ["umap-learn==0.5.12"]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
